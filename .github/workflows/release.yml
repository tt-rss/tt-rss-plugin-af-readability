name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up PHP
        uses: shivammathur/setup-php@7d835878343a71575c27bf6a326cbcff35fed5bc
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        run: |
          # Try install first with existing lock file (reproducible builds)
          if composer install --no-interaction --prefer-dist; then
            exit 0
          fi
          
          # If install fails, lock file is out of sync - regenerate it
          # This is a fallback only when the committed lock file is invalid
          rm -f composer.lock
          composer install --no-interaction --prefer-dist
          
          # Validate and commit the regenerated lock file
          composer validate --strict
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: regenerate composer.lock to sync with composer.json"
          git push

      - name: Validate composer
        run: composer validate

      - name: Setup Node.js
        uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65
        with:
          node-version: '24'

      - name: Install semantic-release with locked versions
        run: |
          npm install --package-lock-only --ignore-scripts \
            "@semantic-release/changelog@6.0.3" \
            "@semantic-release/exec@6.0.3" \
            "@semantic-release/git@10.0.1" \
            "@semantic-release/github@9.2.6"
          npm install --ignore-scripts

      - name: Release with semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release
          GIT_AUTHOR_EMAIL: semantic-release@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release
          GIT_COMMITTER_EMAIL: semantic-release@users.noreply.github.com
        run: |
          # Run semantic-release and capture exit code.
          # Exit code 4 = no release needed (no conventional commits since last release).
          # This is expected behavior and should not fail the workflow.
          run_semantic_release() {
            npx --no semantic-release
            return $?
          }
          run_semantic_release
          exit_code=$?
          if [ "$exit_code" -eq 4 ]; then
            echo "No release needed (no conventional commits)"
            exit 0
          fi
          exit $exit_code
