name: Dependency Update

on:
  schedule:
    # Run every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  # Allow manual trigger
  workflow_dispatch:
  # Allow triggering via API
  repository_dispatch:
    types: [check-dependencies]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@7d835878343a71575c27bf6a326cbcff35fed5bc
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Get latest readability version from Packagist
        id: latest-version
        run: |
          curl -sS "https://packagist.org/packages/fivefilters/readability.php.json" -o /tmp/packagist.json
          echo "" | base64 -d > /tmp/get_version.py
          LATEST=$(python3 /tmp/get_version.py)
          echo "latest_version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest readability.php version: $LATEST"

      - name: Check for updates
        id: check
        run: |
          LATEST="${{ steps.latest-version.outputs.latest_version }}"
          
          # Check if current constraint allows the latest version
          CURRENT=$(grep -oP '"fivefilters/readability.php": "\^?\K[\d.]+' composer.json)
          LATEST_NUM=$(echo "$LATEST" | sed 's/^v//')
          
          echo "Current constraint: ^$CURRENT"
          echo "Latest version: $LATEST_NUM"
          
          # Compare major.minor (ignore patch for ^ constraint)
          CURRENT_MAJOR_MINOR=$(echo "$CURRENT" | cut -d. -f1,2)
          LATEST_MAJOR_MINOR=$(echo "$LATEST_NUM" | cut -d. -f1,2)
          
          echo "Current major.minor: $CURRENT_MAJOR_MINOR"
          echo "Latest major.minor: $LATEST_MAJOR_MINOR"
          
          if [ "$CURRENT_MAJOR_MINOR" != "$LATEST_MAJOR_MINOR" ]; then
            echo "Update available: ^$CURRENT -> ^$LATEST_MAJOR_MINOR"
            echo "update_available=true" >> $GITHUB_OUTPUT
            echo "new_version=^$LATEST_NUM" >> $GITHUB_OUTPUT
          else
            echo "Already up to date"
            echo "update_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Update dependencies
        if: steps.check.outputs.update_available == 'true'
        run: |
          composer require fivefilters/readability.php:${{ steps.check.outputs.new_version }} --no-interaction --with-all-dependencies

      - name: Create Pull Request
        if: steps.check.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update fivefilters/readability.php to ${{ steps.check.outputs.new_version }}"
          title: "Update fivefilters/readability.php to ${{ steps.check.outputs.new_version }}"
          body: |
            ## Dependency Update

            Update `fivefilters/readability.php` to version `${{ steps.check.outputs.new_version }}`.

            This PR was automatically created by the Dependency Update workflow.

            ### Release Notes
            Check the release notes: https://github.com/fivefilters/readability.php/releases/tag/v${{ steps.check.outputs.latest_version }}

            ### Actions
            - [ ] Review the changes
            - [ ] Run tests if available
            - [ ] Merge when ready
          branch: "dependabot/readability-${{ steps.check.outputs.new_version }}"
          delete-branch: true
          base: main
